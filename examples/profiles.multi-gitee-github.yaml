# Personal GitHub + personal Gitee on the same machine.
schemaVersion: 1
identities:
  github:
    user:
      name: alexchen
      email: alex@personal.example
    sshKey: id_ed25519_github
    sites:
      - host: github.com
        port: 443
        sshHostName: ssh.github.com   # GitHub's SSH-over-443 endpoint
        alias: gh
  gitee:
    user:
      name: alexchen
      email: alex@personal.example
    sshKey: id_ed25519_gitee
    sites:
      - host: gitee.com
        alias: gitee
rules:
  - dir: ~/code/github
    identity: github
  - dir: ~/code/gitee
    identity: gitee
settings:
  backupKeep: 20
